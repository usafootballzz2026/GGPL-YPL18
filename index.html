<style>
  :root{
    --pitch-green:#0B4C6E;
    --field-green:#1573A6;
    --field-green-light:#2196C9;
    --cream:#F3EEE0;
    --cream-dim:#E7DFC8;
    --ball-red:#A8341F;
    --ball-red-light:#C4472E;
    --pitch-tan:#C9A876;
    --ink:#16211A;
    --white:#FFFFFF;
    --led-off:#2196C9;
  }
  *{box-sizing:border-box;}
  .app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app *{font-family:inherit;}
  .app .display-font{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    letter-spacing:-0.02em;
  }
  .app .mono{
    font-family:"SF Mono","Courier New",Courier,monospace;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  /* Top nav */
  .topbar{
    background:var(--pitch-green);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:4px solid var(--pitch-tan);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--ball-red);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .brand-mark::before, .brand-mark::after{
    content:"";
    position:absolute;
    width:26px;height:1px;
    background:var(--cream);
    opacity:0.85;
  }
  .brand-mark::before{transform:rotate(20deg);}
  .brand-mark::after{transform:rotate(-20deg);}
  .brand-name{
    font-size:19px;
    font-weight:900;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .brand-name span{color:var(--pitch-tan);}
  .insta-link{
    display:flex;
    align-items:center;
    margin-left:8px;
    color:var(--cream-dim);
    transition:color .15s;
  }
  .insta-link:hover{color:var(--pitch-tan);}

  .boundary-celebration{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:9999;
  }
  .boundary-celebration .txt{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;
    letter-spacing:0.02em;
    text-transform:uppercase;
    font-size:64px;
    text-shadow:0 4px 18px rgba(0,0,0,0.35);
    animation:boundaryPop 1.05s ease-out forwards;
  }
  .boundary-celebration .txt.four{ color:var(--pitch-tan); }
  .boundary-celebration .txt.six{ color:#5F8039; }
  @keyframes boundaryPop{
    0%   { transform:scale(0.3) rotate(-6deg); opacity:0; }
    18%  { transform:scale(1.15) rotate(2deg); opacity:1; }
    30%  { transform:scale(1) rotate(0deg); opacity:1; }
    75%  { transform:scale(1) rotate(0deg); opacity:1; }
    100% { transform:scale(1.3) rotate(0deg); opacity:0; }
  }
  .nav{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
  }
  .nav button{
    background:transparent;
    border:none;
    color:var(--cream-dim);
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    border-radius:3px;
    transition:background .15s, color .15s;
  }
  .nav button:hover{background:rgba(255,255,255,0.08); color:var(--white);}
  .nav button.active{background:var(--pitch-tan); color:var(--pitch-green);}

  .user-box{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .role-pill{
    display:inline-block;
    margin-top:2px;
    padding:2px 8px;
    border-radius:20px;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .role-pill.admin{background:var(--ball-red); color:var(--white);}
  .role-pill.user{background:var(--pitch-tan); color:var(--pitch-green);}

  .auth-box{
    background:var(--white);
    border:1px solid #DDD5BC;
    border-radius:8px;
    padding:28px 26px;
    width:100%;
    max-width:360px;
    box-shadow:0 4px 20px rgba(0,0,0,0.06);
  }

  .main{
    flex:1;
    max-width:1080px;
    width:100%;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .page-title{
    font-size:26px;
    font-weight:900;
    margin:0 0 4px;
    text-transform:uppercase;
    letter-spacing:-0.01em;
  }
  .page-sub{
    color:#5A6459;
    font-size:14px;
    margin:0 0 22px;
  }

  /* Cards */
  .card{
    background:var(--white);
    border:1px solid #DDD5BC;
    border-radius:6px;
    padding:18px;
    margin-bottom:16px;
  }
  .card-title{
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--field-green);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title::after{
    content:"";
    flex:1;
    height:1px;
    background:#E4DEC9;
  }

  /* Buttons */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:4px;
    padding:10px 18px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:transform .1s, filter .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:hover{filter:brightness(1.08);}
  .btn-primary{background:var(--ball-red); color:var(--white);}
  .btn-secondary{background:var(--field-green); color:var(--cream);}
  .btn-outline{background:transparent; color:var(--field-green); border:1.5px solid var(--field-green);}
  .btn-tan{background:var(--pitch-tan); color:var(--pitch-green);}
  .btn-sm{padding:6px 12px; font-size:11px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-block{width:100%;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#5A6459;
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:9px 10px;
    border:1.5px solid #D8D0B8;
    border-radius:4px;
    font-size:14px;
    background:var(--white);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--pitch-tan);
    outline-offset:1px;
    border-color:var(--field-green);
  }
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:180px;}

  /* Scoreboard (signature element) */
  .scoreboard{
    background:var(--pitch-green);
    border-radius:8px;
    padding:20px 22px;
    color:var(--cream);
    margin-bottom:16px;
    box-shadow:inset 0 0 0 1px rgba(201,168,118,0.25);
  }
  .scoreboard-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:14px;
  }
  .sb-team{
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--pitch-tan);
    margin-bottom:6px;
  }
  .sb-score{
    font-size:44px;
    font-weight:900;
    line-height:1;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sb-score .wk{color:var(--ball-red-light);}
  .sb-oversbox{
    text-align:right;
  }
  .sb-oversbox .lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cream-dim); opacity:0.75;}
  .sb-oversbox .val{font-size:22px; font-weight:800;}
  .sb-crr{font-size:12px; color:var(--cream-dim); margin-top:4px;}
  .watermark{
    text-align:center;
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed rgba(243,238,224,0.15);
    font-size:11px;
    font-weight:800;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(201,168,118,0.55);
  }
  .watermark.on-light{
    border-top:1px dashed #E4DEC9;
    color:#B9AE8D;
  }
  .sb-status{
    margin-top:12px;
    font-size:13px;
    font-weight:700;
    color:var(--pitch-tan);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .sb-watermark{
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed rgba(243,238,224,0.15);
    text-align:center;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(243,238,224,0.35);
  }
  .card-watermark{
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed #E4DEC9;
    text-align:center;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#B9AE8D;
  }

  .batting-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px dashed rgba(243,238,224,0.15);
    font-size:14px;
  }
  .batting-row:last-child{border-bottom:none;}
  .batting-row.striker{color:var(--pitch-tan); font-weight:800;}
  .batting-row .stats{color:var(--cream-dim); font-size:12px;}

  .bowler-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:14px;
    font-weight:700;
  }
  .bowler-row .stats{color:var(--cream-dim); font-size:12px; font-weight:400;}

  /* Ball log chips */
  .over-log{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .ball-chip{
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;
    background:var(--field-green-light);
    color:var(--cream);
  }
  .ball-chip.w{background:var(--ball-red);}
  .ball-chip.b4{background:var(--pitch-tan); color:var(--pitch-green);}
  .ball-chip.b6{background:#7A9C4C; color:var(--white);}

  /* Scoring pad */
  .pad-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .pad-btn{
    padding:16px 6px;
    border-radius:5px;
    border:none;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    background:var(--field-green);
    color:var(--cream);
  }
  .pad-btn:hover{filter:brightness(1.1);}
  .pad-btn.four{background:var(--pitch-tan); color:var(--pitch-green);}
  .pad-btn.six{background:#5F8039; color:var(--white);}
  .extras-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .extras-grid button{
    padding:10px 6px;
    border-radius:5px;
    border:1.5px solid var(--field-green);
    background:transparent;
    color:var(--field-green);
    font-weight:800;
    font-size:12px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .extras-grid button:hover{background:rgba(32,69,45,0.08);}
  .wicket-btn{
    width:100%;
    padding:12px;
    border-radius:5px;
    border:none;
    background:var(--ball-red);
    color:var(--white);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    margin-bottom:10px;
  }

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left;
    padding:8px 10px;
    background:var(--field-green);
    color:var(--cream);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:800;
  }
  th:first-child{border-radius:4px 0 0 0;}
  th:last-child{border-radius:0 4px 0 0;}
  td{padding:8px 10px; border-bottom:1px solid #EDE7D3;}
  tr:nth-child(even) td{background:#FBF9F2;}
  .rank-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--pitch-tan);
    color:var(--pitch-green);
    font-weight:900;
    font-size:11px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:#8A8F7E;
  }
  .empty .big{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:6px;}

  .match-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border:1px solid #DDD5BC;
    border-radius:6px;
    margin-bottom:10px;
    background:var(--white);
    cursor:pointer;
    transition:box-shadow .15s;
  }
  .match-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08);}
  .match-name{font-weight:800; font-size:14px;}
  .match-meta{font-size:12px; color:#8A8F7E; margin-top:3px;}
  .status-pill{
    padding:4px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .status-pill.live{background:var(--ball-red); color:var(--white);}
  .status-pill.completed{background:#DDD5BC; color:var(--ink);}

  .tag-input-help{font-size:11px; color:#8A8F7E; margin-top:4px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:2px solid #E4DEC9;}
  .tabs button{
    background:none; border:none; padding:9px 4px; margin-right:14px;
    font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
    color:#8A8F7E; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .tabs button.active{color:var(--field-green); border-bottom-color:var(--ball-red);}

  .points-table th, .points-table td{text-align:center;}
  .points-table td:first-child, .points-table th:first-child{text-align:left;}

  .loading-msg{padding:40px; text-align:center; color:#8A8F7E;}
  .inline-form{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-top:10px;}
  .inline-form .field{margin-bottom:0; flex:1; min-width:160px;}
  select{cursor:pointer;}
  .hint{font-size:12px; color:#8A8F7E; margin-top:2px;}
</style>

<div id="root" class="app"><div class="loading-msg">Loading scoreboard…</div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  // --- Firebase setup (Realtime Database) -----------------------------------
  // All shared cricket data (teams/matches/tournaments/playerTypes) and the
  // account directory (users) live here, so every device — admin or viewer —
  // reads and writes the same live data instead of per-browser storage.
  const firebaseConfig = {
    apiKey: "AIzaSyAwcdaAj-vjv8zAqsTVUI1gwdT--YslPnY",
    authDomain: "ggpl-ypl-17.firebaseapp.com",
    databaseURL: "https://ggpl-ypl-17-default-rtdb.firebaseio.com",
    projectId: "ggpl-ypl-17",
    storageBucket: "ggpl-ypl-17.firebasestorage.app",
    messagingSenderId: "110865215422",
    appId: "1:110865215422:web:a2162f2647634d728593ef"
  };

  let db;
  try{
    const firebaseApp = initializeApp(firebaseConfig);
    db = getDatabase(firebaseApp);
  }catch(e){
    console.error('Firebase failed to initialize — the app cannot save or load data until this is fixed:', e);
  }

(function(){
  // Realtime Database paths. DATA/USERS are shared across every device by design.
  // Login/session state is deliberately NOT stored here — see SESSION_KEY below,
  // which uses localStorage because it is a per-device concern, not shared data.
  const DATA_PATH = 'ggplypl/data';
  const USERS_PATH = 'ggplypl/users';
  const SESSION_KEY = 'ggplypl-session'; // localStorage — which account is logged in on this device/browser
  let state = {
    teams: [],
    matches: [],
    tournaments: [],
    playerTypes: {}, // name -> 'Batter' | 'Bowler' | 'All-rounder'
    users: [],
    currentUser: null, // {id, username, fullName, role}
    authMode: 'login', // 'login' | 'signup'
    authError: '',
    view: 'dashboard',
    activeMatchId: null,
    activeTournamentId: null,
    playersTab: 'batting',
    rankingsTab: 'batters',
    draftTournament: null,
    showAddTourMatch: false,
    confirmDeleteMatchId: null,
    pendingNewBatsman: null // for prompting after wicket
  };
  let saveTimer = null;

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function isAdmin(){ return !!(state.currentUser && state.currentUser.role==='admin'); }

  // NOTE: this is a lightweight, demo-level account system for gating what's shown in the UI —
  // it is not secure authentication. Accounts live in shared storage (visible to anyone using
  // this app), and the "password check" below is a simple non-cryptographic hash, not real
  // encryption. Don't reuse a real/sensitive password here.
  function simpleHash(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
    return 'h'+Math.abs(h).toString(36);
  }

  function persist(){
    // Debounced so rapid-fire scoring taps don't fire a write per click —
    // writes the full shared payload to Firebase Realtime Database.
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const payload = { teams: state.teams, matches: state.matches, tournaments: state.tournaments, playerTypes: state.playerTypes };
      try{
        await set(ref(db, DATA_PATH), payload);
      }catch(e){ console.error('Firebase save failed (match/team/tournament data):', e); }
    }, 250);
  }

  async function persistUsers(){
    try{
      await set(ref(db, USERS_PATH), state.users);
    }catch(e){ console.error('Firebase save failed (user accounts):', e); }
  }

  function persistSession(){
    // Session/login state is a per-device concern, not shared cricket data —
    // this intentionally stays in localStorage, never in Firebase.
    try{
      if(state.currentUser){
        localStorage.setItem(SESSION_KEY, JSON.stringify({userId: state.currentUser.id}));
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }catch(e){ console.error('Session save failed (localStorage):', e); }
  }

  async function load(){
    try{
      const snap = await get(ref(db, DATA_PATH));
      if(snap.exists()){
        const data = snap.val() || {};
        state.teams = data.teams || [];
        state.matches = data.matches || [];
        state.tournaments = data.tournaments || [];
        state.playerTypes = data.playerTypes || {};
        state._lastDataRaw = JSON.stringify(data);
      }
    }catch(e){ console.error('Firebase load failed (match/team/tournament data):', e); }

    try{
      const usnap = await get(ref(db, USERS_PATH));
      if(usnap.exists()){
        state.users = usnap.val() || [];
      }
    }catch(e){ console.error('Firebase load failed (user accounts):', e); }

    if(state.users.length===0){
      // seed a default admin account so the app is usable out of the box
      state.users.push({id:uid(), username:'admin', passwordHash:simpleHash('admin123'), fullName:'Admin', role:'admin'});
      await persistUsers();
    }

    try{
      const raw = localStorage.getItem(SESSION_KEY);
      if(raw){
        const sess = JSON.parse(raw);
        if(sess && sess.userId){
          const u = state.users.find(u=>u.id===sess.userId);
          if(u) state.currentUser = u;
        }
      }
    }catch(e){ console.error('Session load failed (localStorage):', e); }

    // Real-time sync: viewers get pushed updates the instant the admin saves —
    // no polling, no manual refresh. Admin skips this (their own local state,
    // updated synchronously the moment they tap, is already the source of truth
    // for their screen) — same behavior the old polling fallback used.
    onValue(ref(db, DATA_PATH), (snap)=>{
      if(!state.currentUser || isAdmin()) return;
      if(!snap.exists()) return;
      const data = snap.val() || {};
      const raw = JSON.stringify(data);
      if(raw === state._lastDataRaw) return;
      state._lastDataRaw = raw;
      state.teams = data.teams || [];
      state.matches = data.matches || [];
      state.tournaments = data.tournaments || [];
      state.playerTypes = data.playerTypes || {};
      render();
    }, (err)=>{ console.error('Firebase realtime listener error (match/team/tournament data):', err); });

    // Keep the account directory fresh in the background (new signups from
    // other devices, role/type changes) without forcing a re-render — that
    // would wipe out whatever someone is mid-typing in a login/signup form.
    onValue(ref(db, USERS_PATH), (snap)=>{
      if(!snap.exists()) return;
      state.users = snap.val() || [];
    }, (err)=>{ console.error('Firebase realtime listener error (user accounts):', err); });

    render();
  }

  function setView(v, extra){
    state.view = v;
    if(extra) Object.assign(state, extra);
    render();
  }

  // ---------- Derived stats ----------
  function getTeam(id){ return state.teams.find(t=>t.id===id); }
  function getMatch(id){ return state.matches.find(m=>m.id===id); }
  function getPlayerType(name){ return state.playerTypes[name] || 'Not Set'; }


  function computePlayerStats(matchList){
    const matches = matchList || state.matches;
    const stats = {}; // name -> {matches:Set, runs, balls, fours, sixes, outs, wickets, runsConceded, ballsBowled}
    function ensure(name){
      if(!stats[name]) stats[name] = {name, matches:new Set(), runs:0, balls:0, fours:0, sixes:0, outs:0, dismissals:0, wickets:0, runsConceded:0, ballsBowled:0};
      return stats[name];
    }
    matches.forEach(m=>{
      const involved = new Set();
      (m.innings||[]).forEach(inn=>{
        Object.entries(inn.batsmen||{}).forEach(([name, b])=>{
          const s = ensure(name); involved.add(name);
          s.runs += b.runs; s.balls += b.balls; s.fours += b.fours; s.sixes += b.sixes;
          if(b.out) s.dismissals += 1;
        });
        Object.entries(inn.bowlers||{}).forEach(([name, b])=>{
          const s = ensure(name); involved.add(name);
          s.wickets += b.wickets; s.runsConceded += b.runs; s.ballsBowled += b.balls;
        });
      });
      involved.forEach(name=> ensure(name).matches.add(m.id));
    });
    return Object.values(stats).map(s=>({
      ...s,
      matches: s.matches.size,
      average: s.dismissals>0 ? (s.runs/s.dismissals) : (s.runs>0? s.runs : 0),
      strikeRate: s.balls>0 ? (s.runs/s.balls*100) : 0,
      economy: s.ballsBowled>0 ? (s.runsConceded/(s.ballsBowled/6)) : 0
    }));
  }

  function oversStr(balls){
    const o = Math.floor(balls/6); const b = balls%6;
    return o + '.' + b;
  }

  function fmt1(n){ return Math.round(n*10)/10; }

  function celebrateBoundary(runs){
    const label = runs===6 ? 'six' : 'four';
    const overlay = el('div',{class:'boundary-celebration'},[

  // ---------- Match engine ----------
  function newInnings(battingTeamId, bowlingTeamId){
    return {
      battingTeamId, bowlingTeamId,
      runs:0, wickets:0, legalBalls:0,
      striker:null, nonStriker:null, bowler:null,
      batsmen:{}, bowlers:{},
      thisOver:[], // display chips for current over
      history:[], // full ball history for undo
      completed:false
    };
  }

  function ensureBatsman(inn, name){
    if(!inn.batsmen[name]) inn.batsmen[name] = {runs:0, balls:0, fours:0, sixes:0, out:false};
    return inn.batsmen[name];
  }
  function ensureBowler(inn, name){
    if(!inn.bowlers[name]) inn.bowlers[name] = {runs:0, balls:0, wickets:0};
    return inn.bowlers[name];
  }

  function currentInnings(match){ return match.innings[match.innings.length-1]; }

  function playBall(match, {runsOffBat=0, extraType=null, isWicket=false}){
    const inn = currentInnings(match);
    if(!inn.striker || !inn.nonStriker || !inn.bowler) return;
    const legal = !(extraType==='wide' || extraType==='noball');
    const extraRuns = (extraType==='wide' || extraType==='noball') ? 1 : 0;
    const teamRuns = runsOffBat + extraRuns;
    const batsmanRuns = (extraType==='bye' || extraType==='legbye' || extraType==='wide') ? 0 : runsOffBat;

    inn.runs += teamRuns;
    const bat = ensureBatsman(inn, inn.striker);
    const bowl = ensureBowler(inn, inn.bowler);

    if(legal){
      bat.balls += 1;
      bowl.balls += 1;
    }
    bat.runs += batsmanRuns;
    if(batsmanRuns===4) bat.fours += 1;
    if(batsmanRuns===6) bat.sixes += 1;
    bowl.runs += teamRuns;

    let dismissedName = null;
    if(isWicket){
      inn.wickets += 1;
      bat.out = true;
      bowl.wickets += 1;
      dismissedName = inn.striker;
    }

    // record for undo + display
    const chip = isWicket ? 'W' : (extraType==='wide' ? 'Wd' : extraType==='noball' ? 'Nb' : extraType==='bye' ? teamRuns+'b' : extraType==='legbye' ? teamRuns+'lb' : String(runsOffBat));
    inn.history.push({runsOffBat, extraType, isWicket, striker:inn.striker, nonStriker:inn.nonStriker, bowler:inn.bowler, legal, teamRunsAdded:teamRuns, dismissedName});
    if(legal) inn.thisOver.push(chip); else inn.thisOver.push(chip);

    if(legal) inn.legalBalls += 1;

    // strike rotation on odd runs (off bat runs matter for byes/legbyes too)
    const runsForRotation = (extraType==='bye'||extraType==='legbye') ? runsOffBat : (extraType==='wide'||extraType==='noball' ? runsOffBat : runsOffBat);
    if(runsForRotation % 2 === 1){
      const tmp = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = tmp;
    }

    // over complete
    if(legal && inn.legalBalls % 6 === 0){
      inn.thisOver = [];
      const tmp = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = tmp;
      inn.bowler = null; // force selecting next over's bowler
    }

    if(isWicket){
      inn.striker = null; // force selecting new batsman
    }

    persist();
  }

  function battingTeamPlayersRemaining(match, inn){
    const team = getTeam(inn.battingTeamId);
    if(!team) return [];
    return team.players.filter(p => !(inn.batsmen[p] && inn.batsmen[p].out) && p!==inn.striker && p!==inn.nonStriker);
  }

  function el(tag, opts, children){
    const e = document.createElement(tag);
    if(opts){
      Object.entries(opts).forEach(([k,v])=>{
        if(k==='class') e.className = v;
        else if(k==='html') e.innerHTML = v;
        else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
        else e.setAttribute(k, v);
      });
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'? document.createTextNode(c): c); });
    return e;
  }

  // ---- Scoring ----
  function viewScoring(){
    const match = getMatch(state.activeMatchId);
    if(!match) { const w=el('div',{}); w.appendChild(el('div',{class:'empty'},['Match not found.'])); return w; }
    const inn = currentInnings(match);
    const battingTeam = getTeam(inn.battingTeamId);
    const bowlingTeam = getTeam(inn.bowlingTeamId);

    const wrap = el('div',{});
    wrap.appendChild(el('h1',{class:'page-title display-font'},[match.name]));
    wrap.appendChild(el('p',{class:'page-sub'},[battingTeam.name+' vs '+bowlingTeam.name+' · '+match.totalOvers+' overs a side']));
    if(match.toss){
      wrap.appendChild(el('p',{class:'page-sub', style:'margin-top:-16px; font-weight:700; color:var(--field-green);'},['Toss: '+match.toss.winnerName+' won and elected to '+match.toss.decision+'.']));
    }

    if(match.status==='completed'){
      wrap.appendChild(buildMatchSummary(match));
      wrap.appendChild(el('button',{class:'btn btn-outline', onClick:()=>setView('dashboard')},['Back to Matches']));
      return wrap;
    }

    // 1st innings recap — always visible once the chase is on
    if(match.innings.length > 1){
      const inn1 = match.innings[0];
      const team1 = getTeam(inn1.battingTeamId);
      wrap.appendChild(el('div',{class:'card', style:'padding:12px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;'},[
        el('div',{style:'font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:#5A6459;'},['1st Innings']),
        el('div',{class:'mono', style:'font-weight:800; font-size:15px;'},[team1.name+'  '+inn1.runs+'/'+inn1.wickets+'  ('+oversStr(inn1.legalBalls)+' ov)'])
      ]));
    }

    // Scoreboard
    const sb = el('div',{class:'scoreboard'});
    const crr = inn.legalBalls>0 ? (inn.runs/(inn.legalBalls/6)) : 0;
    sb.appendChild(el('div',{class:'scoreboard-top'},[
      el('div',{},[
        el('div',{class:'sb-team'},[battingTeam.name + ' — Innings ' + match.innings.length]),
        el('div',{class:'sb-score mono'},[
          el('span',{},[inn.runs+'']), el('span',{class:'wk'},['/'+inn.wickets])
        ])
      ]),
      el('div',{class:'sb-oversbox'},[
        el('div',{class:'lbl'},['Overs']),
        el('div',{class:'val mono'},[oversStr(inn.legalBalls)+' / '+match.totalOvers]),
        el('div',{class:'sb-crr'},['CRR '+fmt1(crr)])
      ])
    ]));

    if(match.innings.length > 1){
      const inn1 = match.innings[0];
      const target = inn1.runs + 1;
      const totalBalls = match.totalOvers*6;
      const ballsRemaining = Math.max(0, totalBalls - inn.legalBalls);
      const runsNeeded = Math.max(0, target - inn.runs);
      const rrr = ballsRemaining>0 ? (runsNeeded/(ballsRemaining/6)) : 0;
      let chaseLine;
      if(inn.runs >= target){
        chaseLine = 'Target reached';
      } else if(ballsRemaining<=0 || inn.completed){
        chaseLine = 'Innings over';
      } else {
        chaseLine = 'Need ' + runsNeeded + ' runs off ' + ballsRemaining + ' balls · RRR ' + fmt1(rrr);
      }
      sb.appendChild(el('div',{class:'sb-status'},['Target '+target+' · '+chaseLine]));
    }

    if(inn.striker){
      sb.appendChild(el('div',{class:'batting-row striker'},[
        el('div',{},['★ '+inn.striker]),
        el('div',{class:'stats mono'},[battingLine(inn, inn.striker)])
      ]));
    }
    if(inn.nonStriker){
      sb.appendChild(el('div',{class:'batting-row'},[
        el('div',{},[inn.nonStriker]),
        el('div',{class:'stats mono'},[battingLine(inn, inn.nonStriker)])

    if(inn.bowler){
      const bb = inn.bowlers[inn.bowler] || {runs:0,balls:0,wickets:0};
      sb.appendChild(el('div',{class:'bowler-row'},[
        el('div',{},[inn.bowler]),

      ]));
    }
    if(inn.thisOver.length){

    }
    sb.appendChild(el('div',{class:'sb-watermark mono'},['GGPL&YPL']));
    wrap.appendChild(sb);

    // Innings-over / all-out / target-reached checks
    let inningsOver = inn.legalBalls >= match.totalOvers*6 || inn.wickets >= (battingTeam.players.length - 1);
    if(match.innings.length > 1){
      const target = match.innings[0].runs + 1;
      if(inn.runs >= target) inningsOver = true; // chase completed — no need to bowl the rest
    }
    if(inningsOver && !inn.completed){
      inn.completed = true;
      persist();
    }

    if(inn.completed){
      wrap.appendChild(buildInningsBreak(match, inn));

    if(!isAdmin()){

      } else {

      waitCard.appendChild(el('button',{class:'btn btn-outline btn-sm', onClick:()=>setView('dashboard')},['Back to Matches']));
      wrap.appendChild(waitCard);
      return wrap;
    }

    // Need new batsman?
    if(!inn.striker || !inn.nonStriker){
      wrap.appendChild(buildSelectBatsmen(match, inn, battingTeam));
      return wrap;
    }
    // Need new bowler?

      wrap.appendChild(buildSelectBowler(match, inn, bowlingTeam));

    }

    // Scoring pad
    const padCard = el('div',{class:'card'});
    padCard.appendChild(el('div',{class:'card-title'},['Score This Ball']));

  const grid = el('div',{class:'pad-grid'});
    [0,1,2,3,4,5,6].forEach(r=>{

  function battingLine(inn, name){
    const b = inn.batsmen[name] || {runs:0,balls:0,fours:0,sixes:0};
    return b.runs+' ('+b.balls+'b, '+b.fours+'x4, '+b.sixes+'x6)';
  }

  function chipFor(h){
    return h.isWicket ? 'W' : (h.extraType==='wide' ? 'Wd' : h.extraType==='noball' ? 'Nb' : h.extraType==='bye' ? h.teamRunsAdded+'b' : h.extraType==='legbye' ? h.teamRunsAdded+'lb' : String(h.runsOffBat));
  }

  function rebuildThisOver(inn){
    let legalCount = 0;
    let over = [];
    inn.history.forEach(h=>{
      over.push(chipFor(h));
      if(h.legal){
        legalCount++;
        if(legalCount % 6 === 0) over = [];
      }
    });
    inn.thisOver = over;
  }

  function undoLastBall(match){
    const inn = currentInnings(match);
    const last = inn.history.pop();
    if(!last) return;
    const legal = !(last.extraType==='wide'||last.extraType==='noball');
    const extraRuns = (last.extraType==='wide'||last.extraType==='noball') ? 1:0;
    const teamRuns = last.runsOffBat + extraRuns;
    const batsmanRuns = (last.extraType==='bye'||last.extraType==='legbye'||last.extraType==='wide') ? 0 : last.runsOffBat;
    inn.runs -= teamRuns;
    if(inn.batsmen[last.striker]){
      const b = inn.batsmen[last.striker];
      if(legal) b.balls -= 1;
      b.runs -= batsmanRuns;
      if(batsmanRuns===4) b.fours -=1;
      if(batsmanRuns===6) b.sixes -=1;
      if(last.isWicket) b.out = false;
    }
    if(inn.bowlers[last.bowler]){
      const bw = inn.bowlers[last.bowler];
      if(legal) bw.balls -= 1;
      bw.runs -= teamRuns;
      if(last.isWicket) bw.wickets -= 1;
    }
    if(last.isWicket) inn.wickets -= 1;
    // restore strikers/bowler exactly as they were before this ball was bowled
    inn.striker = last.striker;
    inn.nonStriker = last.nonStriker;
    inn.bowler = last.bowler;
    if(legal) inn.legalBalls -= 1;
    rebuildThisOver(inn);
    inn.completed = false;
    persist();
  }

    card.appendChild(el('p',{},[battingTeam.name+' scored '+inn.runs+'/'+inn.wickets+' in '+oversStr(inn.legalBalls)+' overs.']));

  function computeMatchAwards(match){
    const bat = {}, bowl = {};
    match.innings.forEach(inn=>{
      Object.entries(inn.batsmen||{}).forEach(([name,b])=>{
        if(!bat[name]) bat[name] = {name, runs:0, balls:0};
        bat[name].runs += b.runs; bat[name].balls += b.balls;
      });
      Object.entries(inn.bowlers||{}).forEach(([name,b])=>{
        if(!bowl[name]) bowl[name] = {name, wickets:0, runs:0, balls:0};
        bowl[name].wickets += b.wickets; bowl[name].runs += b.runs; bowl[name].balls += b.balls;
      });
    });
    const batList = Object.values(bat);
    const bowlList = Object.values(bowl).map(b=>({...b, economy: b.balls>0 ? (b.runs/(b.balls/6)) : 0}));
    if(batList.length===0 && bowlList.length===0) return null;

    const bestBatter = batList.length ? [...batList].sort((a,b)=>b.runs-a.runs)[0] : null;
    const bestBowler = bowlList.length ? [...bowlList].sort((a,b)=> b.wickets-a.wickets || a.economy-b.economy)[0] : null;

    const impactMap = {};
    batList.forEach(b=>{ impactMap[b.name] = (impactMap[b.name]||{name:b.name, runs:0, wickets:0}); impactMap[b.name].runs = b.runs; });
    bowlList.forEach(b=>{ impactMap[b.name] = (impactMap[b.name]||{name:b.name, runs:0, wickets:0}); impactMap[b.name].wickets = b.wickets; });
    const impactList = Object.values(impactMap).map(p=>({...p, impact: p.runs + p.wickets*20}));
    const gameChanger = impactList.length ? [...impactList].sort((a,b)=>b.impact-a.impact)[0] : null;

    return { bestBatter, bestBowler, gameChanger };
  }

    return wrap;

  // ---- Tournaments ----
  function ensureDraftTournament(){
    if(!state.draftTournament){
      state.draftTournament = { name:'', location:'', overs:20, teams:[{name:'',players:''},{name:'',players:''}] };
    }
  }

  function buildTourMatchPicker(tour){
    const box = el('div',{style:'margin-top:12px; border-top:1px dashed #E4DEC9; padding-top:12px;'});
    if(tour.teamIds.length<2){
      box.appendChild(el('div',{class:'hint'},['This tournament needs at least 2 teams before you can schedule a match.']));
      return box;
    }
    const teamAField = el('div',{class:'field'});
    teamAField.appendChild(el('label',{},['Team A']));
    const selA = el('select',{});
    const teamBField = el('div',{class:'field'});
    teamBField.appendChild(el('label',{},['Team B']));
    const selB = el('select',{});
    tour.teamIds.forEach(id=>{ const t=getTeam(id); if(t){ selA.appendChild(el('option',{value:id},[t.name])); selB.appendChild(el('option',{value:id},[t.name])); } });
    if(tour.teamIds.length>1) selB.selectedIndex = 1;
    teamAField.appendChild(selA); teamBField.appendChild(selB);

    const oversField = inputField('Overs for this match','number','20');
    oversField.querySelector('input').value = tour.overs || 20;

    const matchNameField = inputField('Match name (optional)','text', getTeam(tour.teamIds[0]).name+' vs '+getTeam(tour.teamIds[1]).name);

    const tossWinnerField = el('div',{class:'field'});
    tossWinnerField.appendChild(el('label',{},['Toss won by']));
    const tossWinnerSel = el('select',{});
    tossWinnerSel.appendChild(el('option',{value:'a'},['Team A']));
    tossWinnerSel.appendChild(el('option',{value:'b'},['Team B']));
    tossWinnerField.appendChild(tossWinnerSel);

    const tossDecisionField = el('div',{class:'field'});
    tossDecisionField.appendChild(el('label',{},['Elected to']));
    const tossDecisionSel = el('select',{});
    tossDecisionSel.appendChild(el('option',{value:'bat'},['Bat']));
    tossDecisionSel.appendChild(el('option',{value:'bowl'},['Bowl']));
    tossDecisionField.appendChild(tossDecisionSel);

    box.appendChild(matchNameField);
    box.appendChild(el('div',{class:'row'},[teamAField, teamBField]));
    box.appendChild(oversField);
    box.appendChild(el('div',{class:'row'},[tossWinnerField, tossDecisionField]));

    const err = el('div',{style:'color:var(--ball-red); font-size:12px; margin:6px 0; display:none;'});
    box.appendChild(err);

    const btnRow = el('div',{style:'display:flex; gap:8px;'});
    btnRow.appendChild(el('button',{class:'btn btn-primary btn-sm', onClick:()=>{
      if(selA.value === selB.value){
        err.textContent = 'Pick two different teams.'; err.style.display='block'; return;
      }
      const totalOvers = parseInt(oversField.querySelector('input').value) || (tour.overs||20);
      const mName = matchNameField.querySelector('input').value.trim() || (getTeam(selA.value).name+' vs '+getTeam(selB.value).name);
      const tossWinnerId = tossWinnerSel.value==='a' ? selA.value : selB.value;
      const tossLoserId = tossWinnerSel.value==='a' ? selB.value : selA.value;
      const decision = tossDecisionSel.value;
      const battingId = decision==='bat' ? tossWinnerId : tossLoserId;
      const bowlingId = decision==='bat' ? tossLoserId : tossWinnerId;
      const match = {
        id: uid(), name: mName, team1Id: selA.value, team2Id: selB.value,
        totalOvers, status:'live', tournamentId: tour.id, location: tour.location || '',
        toss: { winnerName: getTeam(tossWinnerId).name, decision },
        innings: [ newInnings(battingId, bowlingId) ],
        result: null
      };
      state.matches.push(match);
      state.showAddTourMatch = false;
      persist();
      setView('scoring', {activeMatchId: match.id});
    }},['Start Match']));
    btnRow.appendChild(el('button',{class:'btn btn-outline btn-sm', onClick:()=>{ state.showAddTourMatch=false; render(); }},['Cancel']));
    box.appendChild(btnRow);
    return box;
  }

  function viewTournaments(){
    const wrap = el('div',{});
    wrap.appendChild(el('h1',{class:'page-title display-font'},['Tournaments']));
    wrap.appendChild(el('p',{class:'page-sub'},['Group matches into a league and track the points table.']));

    if(!state.activeTournamentId){
      if(isAdmin()){
        ensureDraftTournament();
        const draft = state.draftTournament;
        const newCard = el('div',{class:'card'});
        newCard.appendChild(el('div',{class:'card-title'},['Create Tournament']));

        const nameField = inputField('Tournament name','text','e.g. Weekend Premier League');
        nameField.querySelector('input').value = draft.name;
        nameField.querySelector('input').addEventListener('input', e=>{ draft.name = e.target.value; });
        newCard.appendChild(nameField);

        const locationField = inputField('Location / Venue','text','e.g. MPP School Ground');
        locationField.querySelector('input').value = draft.location;
        locationField.querySelector('input').addEventListener('input', e=>{ draft.location = e.target.value; });
        newCard.appendChild(locationField);

        const oversField = inputField('Overs per match', 'number', '20');
        oversField.querySelector('input').value = draft.overs;
        oversField.querySelector('input').addEventListener('input', e=>{ draft.overs = parseInt(e.target.value)||20; });
        newCard.appendChild(oversField);

        newCard.appendChild(el('div',{style:'font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:#5A6459; margin:14px 0 6px;'},['Teams in this Tournament']));

        draft.teams.forEach((t,i)=>{
          const teamBlock = el('div',{style:'border:1px solid #E4DEC9; border-radius:5px; padding:10px 12px; margin-bottom:10px;'});
          const teamHead = el('div',{style:'display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;'},[
            el('div',{style:'font-weight:800; font-size:12px; text-transform:uppercase; color:var(--field-green);'},['Team '+(i+1)])
          ]);
          if(draft.teams.length>2){
            teamHead.appendChild(el('button',{class:'btn btn-outline btn-sm', onClick:()=>{ draft.teams.splice(i,1); render(); }},['Remove']));
          }
          teamBlock.appendChild(teamHead);
          const nField = inputField('Team name','text','e.g. Warriors');
          nField.querySelector('input').value = t.name;
          nField.querySelector('input').addEventListener('input', e=>{ t.name = e.target.value; });
          const pField = inputField('Players (comma separated)','text','Aarav, Vikram, Rohan, ...');
          pField.querySelector('input').value = t.players;
          pField.querySelector('input').addEventListener('input', e=>{ t.players = e.target.value; });
          teamBlock.appendChild(nField);
          teamBlock.appendChild(pField);
          newCard.appendChild(teamBlock);
        });

        newCard.appendChild(el('button',{class:'btn btn-outline btn-sm', style:'margin-bottom:14px;', onClick:()=>{
          draft.teams.push({name:'',players:''});
          render();
        }},['+ Add Another Team']));

        const err = el('div',{style:'color:var(--ball-red); font-size:12px; margin-bottom:10px; display:none;'});
        newCard.appendChild(err);

        const btnRow = el('div',{style:'display:flex; gap:10px;'});
        btnRow.appendChild(el('button',{class:'btn btn-primary', onClick:()=>{
          const name = draft.name.trim() || 'Untitled Tournament';
          const location = draft.location.trim();
          const overs = draft.overs || 20;
          const validTeams = draft.teams.filter(t=>t.name.trim() && t.players.split(',').map(s=>s.trim()).filter(Boolean).length>=2);
          if(validTeams.length<2){
            err.textContent = 'Add at least 2 teams, each with a name and 2+ players.';
            err.style.display='block';
            return;
          }
          const newTeams = validTeams.map(t=>({id:uid(), name:t.name.trim(), players:t.players.split(',').map(s=>s.trim()).filter(Boolean)}));
          state.teams.push(...newTeams);
          const tour = {id:uid(), name, location, overs, teamIds:newTeams.map(t=>t.id)};
          state.tournaments.push(tour);
          state.draftTournament = null;
          persist();
          setView('tournaments', {activeTournamentId: tour.id});
        }},['Create Tournament']));
        if(draft.name || draft.location || draft.teams.some(t=>t.name||t.players)){
          btnRow.appendChild(el('button',{class:'btn btn-outline', onClick:()=>{
            state.draftTournament = null;
            render();
          }},['Clear Form']));
        }
        newCard.appendChild(btnRow);
        wrap.appendChild(newCard);
      }

      const listCard = el('div',{class:'card'});
      listCard.appendChild(el('div',{class:'card-title'},['Existing Tournaments']));
      if(state.tournaments.length===0){
        listCard.appendChild(el('div',{class:'empty'},['No tournaments yet.']));
      } else {
        state.tournaments.forEach(t=>{
          const card = el('div',{class:'match-card', onClick:()=>setView('tournaments',{activeTournamentId:t.id})},[
            el('div',{},[
              el('div',{class:'match-name'},[t.name]),
              el('div',{class:'match-meta'},[t.teamIds.length+' teams · '+(t.overs||20)+' overs a match'+(t.location? ' · 📍 '+t.location : '')])
            ]),
            el('div',{class:'status-pill completed'},['View'])
          ]);
          listCard.appendChild(card);
        });
      }
      wrap.appendChild(listCard);
      return wrap;
    }

    // Tournament detail
    const tour = state.tournaments.find(t=>t.id===state.activeTournamentId);
    if(!tour){ setView('tournaments',{activeTournamentId:null}); return el('div',{}); }
    wrap.appendChild(el('button',{class:'btn btn-outline btn-sm', onClick:()=>setView('tournaments',{activeTournamentId:null, showAddTourMatch:false})},['← All Tournaments']));

    const header = el('div',{class:'card', style:'margin-top:14px;'});
    header.appendChild(el('div',{class:'card-title'},[tour.name]));
    if(tour.location){
      header.appendChild(el('p',{style:'margin:-6px 0 4px; font-weight:700; color:var(--field-green); font-size:13px;'},['📍 '+tour.location]));
    }
    header.appendChild(el('p',{class:'hint', style:'margin:-6px 0 10px;'},['Teams: '+tour.teamIds.map(id=>{const t=getTeam(id); return t?t.name:'?';}).join(', ')]));
    if(isAdmin()){
      if(!state.showAddTourMatch){
        header.appendChild(el('button',{class:'btn btn-secondary btn-sm', onClick:()=>{ state.showAddTourMatch = true; render(); }},['+ Add Match to Tournament']));
      } else {
        header.appendChild(buildTourMatchPicker(tour));
      }
    }
    wrap.appendChild(header);

    // points table
    const tourMatches = state.matches.filter(m=>m.tournamentId===tour.id);
    const pts = {};
    tour.teamIds.forEach(id=>{ const t=getTeam(id); if(t) pts[id] = {name:t.name, played:0, won:0, lost:0, tied:0, points:0}; });
    tourMatches.forEach(m=>{
      if(m.status!=='completed') return;
      const inn1=m.innings[0], inn2=m.innings[1];
      if(!inn2) return;
      const id1 = inn1.battingTeamId, id2 = inn2.battingTeamId;
      if(pts[id1]) pts[id1].played++;
      if(pts[id2]) pts[id2].played++;
      if(inn1.runs===inn2.runs){
        if(pts[id1]){pts[id1].tied++; pts[id1].points+=1;}
        if(pts[id2]){pts[id2].tied++; pts[id2].points+=1;}
      } else {
        const winner = inn2.runs>inn1.runs ? id2 : id1;
        const loser = winner===id1 ? id2 : id1;
        if(pts[winner]){pts[winner].won++; pts[winner].points+=2;}
        if(pts[loser]){pts[loser].lost++;}
      }
    });

    const ptsCard = el('div',{class:'card'});
    ptsCard.appendChild(el('div',{class:'card-title'},['Points Table']));
    if(Object.keys(pts).length===0){
      ptsCard.appendChild(el('div',{class:'empty'},['No teams added.']));
    } else {
      const table = el('table',{class:'points-table'});
      const thead = el('tr',{});
      ['Team','P','W','L','T','Pts'].forEach(h=>thead.appendChild(el('th',{},[h])));
      table.appendChild(thead);
      Object.values(pts).sort((a,b)=>b.points-a.points).forEach(row=>{
        const tr = el('tr',{});
        [row.name,row.played,row.won,row.lost,row.tied,row.points].forEach(v=>tr.appendChild(el('td',{},[String(v)])));
        table.appendChild(tr);
      });
      ptsCard.appendChild(table);
    }
    wrap.appendChild(ptsCard);

    // Tournament-scoped Top 10 run scorers / wicket takers — updates live as matches are scored,
    // visible to admins and viewers alike.
    const tourStats = computePlayerStats(tourMatches);
    const rankRow = el('div',{class:'row'});

    const runsCard = el('div',{class:'card'});
    runsCard.appendChild(el('div',{class:'card-title'},['Top 10 Run Scorers']));
    const topRuns = [...tourStats].filter(s=>s.runs>0).sort((a,b)=>b.runs-a.runs).slice(0,10);
    if(topRuns.length===0){
      runsCard.appendChild(el('div',{class:'empty'},['No runs scored in this tournament yet.']));
    } else {
      const t = el('table',{});
      const th = el('tr',{});
      ['#','Player','Role','Runs','Avg','SR'].forEach(h=>th.appendChild(el('th',{},[h])));
      t.appendChild(th);
      topRuns.forEach((s,i)=>{
        const tr = el('tr',{});
        const rankTd = el('td',{}); rankTd.appendChild(el('span',{class:'rank-badge'},[String(i+1)]));
        tr.appendChild(rankTd);
        [s.name, getPlayerType(s.name), s.runs, fmt1(s.average), fmt1(s.strikeRate)].forEach(v=>tr.appendChild(el('td',{},[String(v)])));
        t.appendChild(tr);
      });
      runsCard.appendChild(t);
    }
    rankRow.appendChild(runsCard);

    const wktsCard = el('div',{class:'card'});
    wktsCard.appendChild(el('div',{class:'card-title'},['Top 10 Wicket Takers']));
    const topWkts = [...tourStats].filter(s=>s.wickets>0 || s.ballsBowled>0).sort((a,b)=> b.wickets-a.wickets || a.economy-b.economy).slice(0,10);
    if(topWkts.length===0){
      wktsCard.appendChild(el('div',{class:'empty'},['No wickets taken in this tournament yet.']));
    } else {
      const t = el('table',{});
      const th = el('tr',{});
      ['#','Player','Role','Wkts','Overs','Econ'].forEach(h=>th.appendChild(el('th',{},[h])));
      t.appendChild(th);
      topWkts.forEach((s,i)=>{
        const tr = el('tr',{});
        const rankTd = el('td',{}); rankTd.appendChild(el('span',{class:'rank-badge'},[String(i+1)]));
        tr.appendChild(rankTd);
        [s.name, getPlayerType(s.name), s.wickets, oversStr(s.ballsBowled), fmt1(s.economy)].forEach(v=>tr.appendChild(el('td',{},[String(v)])));
        t.appendChild(tr);
      });
      wktsCard.appendChild(t);
    }
    rankRow.appendChild(wktsCard);

    wrap.appendChild(rankRow);

    const matchesCard = el('div',{class:'card'});
    matchesCard.appendChild(el('div',{class:'card-title'},['Matches']));
    if(tourMatches.length===0){
      matchesCard.appendChild(el('div',{class:'empty'},['No matches added yet.']));
    } else {
      tourMatches.forEach(m=>{
        matchesCard.appendChild(buildMatchCard(m));
      });
    }
    wrap.appendChild(matchesCard);

    return wrap;
  }

  load();
})();
</script>
